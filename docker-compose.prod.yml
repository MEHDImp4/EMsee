services:
  # Backend API service
  backend:
    image: ghcr.io/mehdimp4/projetjs-backend:latest
    container_name: projetjs-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-change_me}@db:5432/${DB_NAME:-projetjs_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-change_me_to_a_very_long_random_string}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - NODE_ENV=production
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app-network

  # Frontend Web service (handled by Nginx)
  frontend:
    image: ghcr.io/mehdimp4/projetjs-frontend:latest
    container_name: projetjs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - backend
    networks:
      - app-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: projetjs-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-change_me}
      - POSTGRES_DB=${DB_NAME:-projetjs_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    # Optimization flags for PostgreSQL
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"

  # Automatic Updates service
  watchtower:
    image: containrrr/watchtower
    container_name: projetjs-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 5 --cleanup --label-enable
    networks:
      - app-network

  # Database Management Tool
  prisma-studio:
    image: ghcr.io/mehdimp4/projetjs-backend:latest
    container_name: projetjs-prisma-studio
    restart: unless-stopped
    ports:
      - "${PRISMA_STUDIO_PORT:-5555}:5555"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-change_me}@db:5432/${DB_NAME:-projetjs_db}?schema=public
    command: npx prisma studio --port 5555 --browser none
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:

