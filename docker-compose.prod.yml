services:
  backend:
    image: ghcr.io/mehdimp4/projetjs-backend:latest
    container_name: projetjs-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - NODE_ENV=production
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app-network

  frontend:
    image: ghcr.io/mehdimp4/projetjs-frontend:latest
    container_name: projetjs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: projetjs-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    # Optimization flags for PostgreSQL (adjust based on VPS resources)
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"

  watchtower:
    image: containrrr/watchtower
    container_name: projetjs-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 5 --cleanup --label-enable
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
